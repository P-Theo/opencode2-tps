name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # tsc, oxlint and build.mjs run on node; the test script is `bun test`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      # dist/ is gitignored, so this proves a clean clone still produces the
      # tarball. Scripts are skipped because prepack would repeat every step above.
      - run: npm pack --dry-run --ignore-scripts
