name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # tsc, oxlint and build.mjs run on node; the test script is `bun test`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - run: npm ci --ignore-scripts

      # The compatibility check needs the CLI, but running its postinstall would
      # restore dependency lifecycle-script execution. The runner is Linux x64.
      - name: Prepare the OpenCode CLI
        run: install -m 755 node_modules/@opencode-ai/cli-linux-x64/bin/opencode2 node_modules/@opencode-ai/cli/bin/opencode2.exe

      - run: npm run check:compatibility

      - name: Verify the official OpenCode 2 beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").devDependencies["@opencode-ai/cli"]')
          gh api "repos/anomalyco/opencode-beta/releases/tags/v${version}" --silent

      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      # dist/ is gitignored, so this also proves a clean clone produces a package
      # whose bundled entrypoint can be installed and imported with its host peers.
      - name: Verify the packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/tps-pack" "$RUNNER_TEMP/tps-install"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/tps-pack"
          opentui=$(node -p 'require("./node_modules/@opentui/solid/package.json").version')
          solid=$(node -p 'require("./node_modules/solid-js/package.json").version')
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/tps-install" "$RUNNER_TEMP"/tps-pack/opencode2-tps-*.tgz "@opentui/solid@${opentui}" "solid-js@${solid}"
          node --input-type=module -e 'await import(process.argv[1])' "file://$RUNNER_TEMP/tps-install/node_modules/opencode2-tps/dist/tui.js"
